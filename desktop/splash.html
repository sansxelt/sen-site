<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sansxel — launcher</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background: #050505;
        color: #fafafa;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue",
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        user-select: none;
        cursor: default;
      }

      .launcher {
        position: relative;
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        opacity: 1;
        transition: opacity 460ms ease-in;
      }

      .launcher.fading {
        opacity: 0;
      }

      /* Big soft purple halo behind the wordmark */
      .launcher::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 55% 55% at 50% 50%, rgba(140, 92, 246, 0.55), transparent 60%),
          radial-gradient(ellipse 80% 70% at 50% 50%, rgba(60, 40, 120, 0.22), transparent 75%);
        pointer-events: none;
      }

      /* Subtle inner border so the borderless window has a defined edge */
      .launcher-frame {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(140, 92, 246, 0.18);
        pointer-events: none;
        z-index: 5;
      }

      /* ── Main brand block, centered ─────────────────────────────── */
      .brand {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        position: relative;
        z-index: 1;
      }

      .brand-wordmark {
        font-size: 92px;
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
        margin: 0;
        color: #fcfcff;
        text-shadow:
          0 0 30px rgba(196, 168, 252, 0.35),
          0 4px 36px rgba(140, 92, 246, 0.35);
      }

      .brand-tagline {
        font-size: 17px;
        font-weight: 400;
        letter-spacing: 0.005em;
        color: rgba(200, 200, 220, 0.55);
        margin: 0;
      }

      /* Sharp horizontal "spotlight" band right under the wordmark —
         the bright purple shelf in the reference image */
      .brand-spotlight {
        position: absolute;
        left: 50%;
        bottom: 28%;
        transform: translateX(-50%);
        width: 58%;
        height: 60px;
        background: radial-gradient(
          ellipse 50% 100% at 50% 50%,
          rgba(196, 168, 252, 0.6),
          transparent 70%
        );
        filter: blur(10px);
        pointer-events: none;
        z-index: 0;
      }

      /* ── Bottom row: status left, build info right ──────────────── */
      .footer {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 22px 16px;
        gap: 16px;
      }

      .footer-status {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        letter-spacing: 0.02em;
        color: rgba(220, 220, 235, 0.85);
        font-variant-numeric: tabular-nums;
        min-height: 16px;
      }

      .footer-status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #a78bfa;
        box-shadow: 0 0 10px rgba(167, 139, 250, 0.7);
        animation: dot-pulse 1.4s ease-in-out infinite;
      }

      .footer-status-label {
        display: inline-block;
        animation: label-swap 360ms ease-out;
      }

      .footer-build {
        font-size: 9px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(180, 180, 200, 0.42);
        font-family:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono",
          monospace;
      }

      /* ── Progress bar pinned to the very bottom edge ─────────────── */
      .progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.04);
        overflow: hidden;
        z-index: 3;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(
          90deg,
          rgba(167, 139, 250, 0.35),
          #a78bfa 65%,
          #c4b5fd
        );
        box-shadow: 0 0 14px rgba(167, 139, 250, 0.6);
        /* Width is JS-driven so [Space] can boost it. transition keeps
           the boost smooth instead of jumpy. */
        transition: width 280ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* "[ space to skip ]" hint above the progress bar */
      .skip-hint {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 4;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-family:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono",
          monospace;
        color: rgba(200, 200, 220, 0.45);
        opacity: 0;
        animation: hint-fade-in 480ms ease-out 800ms forwards;
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
      }

      .skip-hint .skip-key {
        display: inline-block;
        padding: 2px 8px;
        margin: 0 4px;
        border-radius: 4px;
        background: rgba(167, 139, 250, 0.12);
        border: 1px solid rgba(167, 139, 250, 0.28);
        color: rgba(220, 210, 255, 0.85);
        letter-spacing: 0.12em;
      }

      .skip-hint.flash .skip-key {
        background: rgba(167, 139, 250, 0.32);
        border-color: rgba(196, 168, 252, 0.6);
        color: #fff;
        transition:
          background 80ms ease-out,
          border-color 80ms ease-out,
          color 80ms ease-out;
      }

      @keyframes hint-fade-in {
        to {
          opacity: 1;
        }
      }

      /* Scanning shimmer over the progress bar */
      .progress::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.18),
          transparent
        );
        transform: translateX(-100%);
        animation: scan 2.4s linear infinite;
      }

      @keyframes dot-pulse {
        0%, 100% {
          opacity: 0.45;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes label-swap {
        from {
          opacity: 0;
          transform: translateY(4px);
          filter: blur(2px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      @keyframes scan {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
    </style>
  </head>

  <body>
    <div class="launcher" id="launcher">
      <div class="launcher-frame"></div>

      <div class="brand">
        <h1 class="brand-wordmark">sansxel</h1>
        <p class="brand-tagline">Build something real.</p>
        <div class="brand-spotlight"></div>
      </div>

      <div class="footer">
        <div class="footer-status">
          <span class="footer-status-dot"></span>
          <span class="footer-status-label" id="status-label">
            Initializing sansxel core
          </span>
        </div>
        <div class="footer-build">v0.1.0 · sansxel-1 · windows</div>
      </div>

      <div class="skip-hint" id="skip-hint">
        Press <span class="skip-key">space</span> to skip
      </div>

      <div class="progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <script>
      (function () {
        // Helper: safely call a Tauri command. Returns silently if the
        // Tauri runtime isn't available (e.g. plain-browser preview).
        function tauriInvoke(cmd) {
          try {
            var invoke =
              window.__TAURI__ &&
              window.__TAURI__.core &&
              window.__TAURI__.core.invoke;
            if (invoke) return invoke(cmd);
          } catch (err) {
            console.error("invoke(" + cmd + ") failed:", err);
          }
        }

        // Minimize every other top-level window so only the splash is
        // visible during boot. User can restore via taskbar after.
        tauriInvoke("minimize_other_windows");

        // ── Progress + label scheduling ─────────────────────────────
        // Steps sum to TOTAL_MS. Progress (0..1) is JS-driven via
        // setInterval so [Space] can boost it. Labels swap when
        // progress crosses each step's cumulative threshold.
        var steps = [
          { label: "Initializing sansxel core", weight: 1.5 },
          { label: "Loading workspace memory",  weight: 2.2 },
          { label: "Syncing context",           weight: 1.7 },
          { label: "Connecting sansxel-1",      weight: 2.8 },
          { label: "Preparing your space",      weight: 1.8 },
        ];
        var TOTAL_MS = 10000;
        var TICK_MS = 50;
        var BASE_PER_TICK = TICK_MS / TOTAL_MS;

        // Cumulative progress thresholds where the label swaps
        var totalWeight = 0;
        for (var s = 0; s < steps.length; s++) totalWeight += steps[s].weight;
        var thresholds = [];
        var acc = 0;
        for (var k = 0; k < steps.length; k++) {
          acc += steps[k].weight / totalWeight;
          thresholds.push(acc);
        }

        var fillEl = document.getElementById("progress-fill");
        var labelEl = document.getElementById("status-label");
        var hintEl = document.getElementById("skip-hint");

        var progress = 0; // 0..1
        var currentStep = 0;
        var handedOver = false;

        // Anti-spam decay for [Space] boosts:
        //   - Each press normally adds BOOST_MAX progress (~7%).
        //   - If the user spams, the multiplier decays toward
        //     BOOST_MIN (~1%). Every "calm" press refills it.
        // The decay represents recent boost-energy used; it bleeds
        // off at REFILL_PER_MS so steady-but-not-spammed presses
        // stay near full strength.
        var BOOST_MAX = 0.07;
        var BOOST_MIN = 0.01;
        var SPAM_DECAY_PER_PRESS = 0.45; // how much energy each press consumes
        var REFILL_PER_MS = 0.0018;       // energy refill rate
        var spamLoad = 0;                 // 0..1 — higher = more recent spam
        var lastBoostAt = 0;

        function setLabelFor(stepIdx) {
          if (stepIdx >= steps.length) return;
          if (stepIdx === currentStep) return;
          currentStep = stepIdx;
          labelEl.textContent = steps[stepIdx].label;
          labelEl.style.animation = "none";
          void labelEl.offsetHeight;
          labelEl.style.animation = "";
        }

        function paint() {
          var pct = Math.max(0, Math.min(1, progress)) * 100;
          fillEl.style.width = pct.toFixed(2) + "%";
          // Move the label to whichever step our progress falls into
          for (var idx = 0; idx < thresholds.length; idx++) {
            if (progress < thresholds[idx]) {
              setLabelFor(idx);
              break;
            }
            if (idx === thresholds.length - 1) setLabelFor(idx);
          }
        }

        function flashHint() {
          if (!hintEl) return;
          hintEl.classList.add("flash");
          setTimeout(function () {
            hintEl.classList.remove("flash");
          }, 110);
        }

        function boost() {
          var now = Date.now();
          // Refill spam energy based on time since last press
          if (lastBoostAt) {
            spamLoad = Math.max(0, spamLoad - (now - lastBoostAt) * REFILL_PER_MS);
          }
          lastBoostAt = now;

          // Boost amount scales with available headroom (1 - spamLoad)
          var headroom = 1 - spamLoad;
          var amount = BOOST_MIN + (BOOST_MAX - BOOST_MIN) * headroom;
          progress = Math.min(1, progress + amount);

          // Consume some energy for this press
          spamLoad = Math.min(1, spamLoad + SPAM_DECAY_PER_PRESS);

          paint();
          flashHint();

          if (progress >= 1 && !handedOver) {
            handedOver = true;
            handover();
          }
        }

        // Steady tick — fills naturally over ~TOTAL_MS
        var ticker = setInterval(function () {
          if (handedOver) {
            clearInterval(ticker);
            return;
          }
          progress = Math.min(1, progress + BASE_PER_TICK);
          paint();
          if (progress >= 1) {
            handedOver = true;
            clearInterval(ticker);
            handover();
          }
        }, TICK_MS);

        // Keys: Esc bails out immediately, Space boosts.
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            handedOver = true;
            tauriInvoke("boot_complete");
            return;
          }
          if (e.code === "Space" || e.key === " " || e.key === "Spacebar") {
            e.preventDefault();
            if (!handedOver) boost();
          }
        });

        function handover() {
          var launcher = document.getElementById("launcher");
          if (launcher) launcher.classList.add("fading");

          // Tell Rust to close the splash and (after its 2.4s blackout
          // gap) reveal the main window. Wait for the fade transition
          // (~460ms) so the handover is smooth.
          setTimeout(function () {
            tauriInvoke("boot_complete");
          }, 460);
        }
      })();
    </script>
  </body>
</html>
