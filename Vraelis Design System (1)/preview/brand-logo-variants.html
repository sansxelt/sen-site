<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:20px;background:var(--bg-0);">
<div style="display:flex;gap:14px;align-items:flex-end">
  <div style="text-align:center"><img src="../assets/logo-mark.svg" alt="violet" style="width:80px;height:80px;border-radius:14px;display:block;margin-bottom:8px"/><div class="mono" style="font-size:10px;color:var(--vio)">violet</div><div class="mono" style="font-size:10px;color:var(--fg-5)">primary</div></div>
  <div style="text-align:center"><img src="../assets/logo-mark-cyan.svg" alt="cyan" style="width:80px;height:80px;border-radius:14px;display:block;margin-bottom:8px"/><div class="mono" style="font-size:10px;color:var(--cya)">cyan</div><div class="mono" style="font-size:10px;color:var(--fg-5)">signal</div></div>

  <div style="text-align:center"><img src="../assets/logo-mark-emerald.svg" alt="emerald" style="width:80px;height:80px;border-radius:14px;display:block;margin-bottom:8px"/><div class="mono" style="font-size:10px;color:var(--ok)">emerald</div><div class="mono" style="font-size:10px;color:var(--fg-5)">ok</div></div>
  <div style="text-align:center"><img src="../assets/logo-circle.svg" alt="circle" style="width:80px;height:80px;border-radius:50%;display:block;margin-bottom:8px"/><div class="mono" style="font-size:10px;color:var(--vio)">circle</div><div class="mono" style="font-size:10px;color:var(--fg-5)">avatar</div></div>
</div>
