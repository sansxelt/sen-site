<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:24px;background:var(--bg-0);">
<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end">
  <div style="text-align:center"><div style="width:64px;height:64px;border:1px solid var(--line-3);background:var(--bg-elev-2);border-radius:6px;margin-bottom:8px"></div><div class="mono" style="font-size:10px;color:var(--fg-3)">r-xs</div><div class="mono" style="font-size:10px;color:var(--fg-5)">6</div></div>
  <div style="text-align:center"><div style="width:64px;height:64px;border:1px solid var(--line-3);background:var(--bg-elev-2);border-radius:10px;margin-bottom:8px"></div><div class="mono" style="font-size:10px;color:var(--fg-3)">r-sm</div><div class="mono" style="font-size:10px;color:var(--fg-5)">10</div></div>
  <div style="text-align:center"><div style="width:64px;height:64px;border:1px solid var(--line-3);background:var(--bg-elev-2);border-radius:14px;margin-bottom:8px"></div><div class="mono" style="font-size:10px;color:var(--fg-3)">r-md</div><div class="mono" style="font-size:10px;color:var(--fg-5)">14</div></div>
  <div style="text-align:center"><div style="width:64px;height:64px;border:1px solid var(--line-3);background:var(--bg-elev-2);border-radius:18px;margin-bottom:8px"></div><div class="mono" style="font-size:10px;color:var(--fg-3)">r-lg</div><div class="mono" style="font-size:10px;color:var(--fg-5)">18</div></div>
  <div style="text-align:center"><div style="width:64px;height:64px;border:1px solid var(--line-3);background:var(--bg-elev-2);border-radius:24px;margin-bottom:8px"></div><div class="mono" style="font-size:10px;color:var(--fg-3)">r-xl</div><div class="mono" style="font-size:10px;color:var(--fg-5)">24</div></div>
  <div style="text-align:center"><div style="width:64px;height:64px;border:1px solid var(--line-3);background:var(--bg-elev-2);border-radius:32px;margin-bottom:8px"></div><div class="mono" style="font-size:10px;color:var(--fg-3)">r-2xl</div><div class="mono" style="font-size:10px;color:var(--fg-5)">32</div></div>
  <div style="text-align:center"><div style="width:120px;height:36px;border:1px solid var(--line-3);background:var(--bg-elev-2);border-radius:999px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:var(--fg-3);font-size:11px">pill</div><div class="mono" style="font-size:10px;color:var(--fg-3)">r-pill</div><div class="mono" style="font-size:10px;color:var(--fg-5)">999</div></div>
</div>
</body></html>
