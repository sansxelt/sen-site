<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:20px;background:var(--bg-0);">
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:stretch;">
  <div style="background:var(--bg-0);border:1px solid var(--line-2);border-radius:12px;padding:14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;">
    <div class="label" style="color:var(--fg-4)">bg-0</div>
    <div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">#050507</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-5);margin-top:2px">page floor</div></div>
  </div>
  <div style="background:var(--bg-1);border:1px solid var(--line-2);border-radius:12px;padding:14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;">
    <div class="label" style="color:var(--fg-4)">bg-1</div>
    <div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">#08080c</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-5);margin-top:2px">card / panel</div></div>
  </div>
  <div style="background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;">
    <div class="label" style="color:var(--fg-4)">bg-2</div>
    <div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">#040406</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-5);margin-top:2px">outro / footer</div></div>
  </div>
  <div style="background:var(--bg-elev-2);border:1px solid var(--line-2);border-radius:12px;padding:14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;">
    <div class="label" style="color:var(--fg-4)">elev-2</div>
    <div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">rgba 255 / .04</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-5);margin-top:2px">tinted surface</div></div>
  </div>
  <div style="background:var(--bg-elev-3);border:1px solid var(--line-2);border-radius:12px;padding:14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;">
    <div class="label" style="color:var(--fg-4)">elev-3</div>
    <div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">rgba 255 / .06</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-5);margin-top:2px">hover</div></div>
  </div>
</div>
</body></html>
