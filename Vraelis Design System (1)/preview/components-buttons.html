<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:24px;background:var(--bg-0);">
<div style="display:flex;flex-direction:column;gap:20px;align-items:flex-start">
  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
    <a class="cta" href="#" style="border-color:var(--sky-line);color:var(--sky)">Open Workshop <span style="font-size:13px">→</span></a>
    <a class="cta cta--vio" href="#">Join Lens waitlist <span style="font-size:13px">→</span></a>
    <a class="cta" href="#" style="border-color:var(--line-3);color:var(--fg-2);background:var(--bg-elev-2)">Sign in</a>
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
    <button style="padding:10px 16px;border-radius:10px;border:none;background:rgba(168,196,255,0.15);color:var(--sky);font-size:13px;font-weight:500;font-family:var(--font-sans);cursor:pointer">Start free</button>
    <button style="padding:10px 16px;border-radius:10px;border:1px solid var(--line-3);background:var(--bg-elev-2);color:var(--fg-2);font-size:13px;font-weight:500;font-family:var(--font-sans);cursor:pointer">Talk to us</button>
    <button style="padding:10px 16px;border-radius:10px;border:1px solid var(--vio-line);background:transparent;color:var(--vio);font-size:13px;font-weight:500;font-family:var(--font-sans);cursor:pointer">Pair Lens</button>
  </div>
  <div style="display:flex;gap:14px;align-items:center;font-size:12px;color:var(--fg-5)">
    <span class="mono" style="font-size:10px">CTA · sky-line / 0.45 black / blur 10px</span>
    <span class="mono" style="font-size:10px">→ button · radius 10 / no shadow</span>
  </div>
</div>
</body></html>
