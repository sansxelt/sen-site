<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:20px;background:var(--bg-0);">
<div style="display:flex;flex-direction:column;gap:10px;">
  <div style="display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-1);">
    <div style="width:28px;height:28px;border-radius:6px;background:var(--fg-1);border:1px solid var(--line-2)"></div>
    <div style="color:var(--fg-1);font-size:15px;font-weight:600;width:80px">fg-1</div>
    <div style="color:var(--fg-1);font-size:15px;flex:1">Cinematic acts. Headlines, key numbers.</div>
    <div class="mono" style="font-size:11px;color:var(--fg-5)">#f5f5f7</div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-1);">
    <div style="width:28px;height:28px;border-radius:6px;background:var(--fg-2);border:1px solid var(--line-2)"></div>
    <div style="color:var(--fg-2);font-size:14px;font-weight:500;width:80px">fg-2</div>
    <div style="color:var(--fg-2);font-size:14px;flex:1">Body default. Paragraph text.</div>
    <div class="mono" style="font-size:11px;color:var(--fg-5)">#e4e4e7</div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-1);">
    <div style="width:28px;height:28px;border-radius:6px;background:var(--fg-3);border:1px solid var(--line-2)"></div>
    <div style="color:var(--fg-3);font-size:14px;width:80px">fg-3</div>
    <div style="color:var(--fg-3);font-size:14px;flex:1">Secondary. Card body, descriptions.</div>
    <div class="mono" style="font-size:11px;color:var(--fg-5)">#a1a1aa</div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-1);">
    <div style="width:28px;height:28px;border-radius:6px;background:var(--fg-4);border:1px solid var(--line-2)"></div>
    <div style="color:var(--fg-4);font-size:13px;width:80px">fg-4</div>
    <div style="color:var(--fg-4);font-size:13px;flex:1">Labels, meta, mono eyebrows.</div>
    <div class="mono" style="font-size:11px;color:var(--fg-5)">#71717a</div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-1);">
    <div style="width:28px;height:28px;border-radius:6px;background:var(--fg-5);border:1px solid var(--line-2)"></div>
    <div style="color:var(--fg-5);font-size:13px;width:80px">fg-5</div>
    <div style="color:var(--fg-5);font-size:13px;flex:1">Whisper-quiet. Captions, disabled.</div>
    <div class="mono" style="font-size:11px;color:var(--fg-5)">#52525b</div>
  </div>
</div>
</body></html>
