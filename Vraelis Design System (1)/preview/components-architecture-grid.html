<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:20px;background:var(--bg-0);">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
  <div style="padding:18px 14px;border-radius:14px;border:1px solid var(--vio-line);background:linear-gradient(180deg,var(--vio-soft),transparent);text-align:center">
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px">
      <span class="dot dot--vio" style="width:7px;height:7px"></span>
      <span class="label" style="color:var(--vio);white-space:nowrap">GLASSES</span>
    </div>
    <div style="font-size:11px;color:var(--fg-4)">capture + render</div>
  </div>
  <div style="padding:18px 14px;border-radius:14px;border:1px solid var(--sky-line);background:linear-gradient(180deg,var(--sky-soft),transparent);text-align:center">
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px">
      <span class="dot dot--sky" style="width:7px;height:7px"></span>
      <span class="label" style="color:var(--sky);white-space:nowrap">PHONE / PC</span>
    </div>
    <div style="font-size:11px;color:var(--fg-4)">compute + memory</div>
  </div>
  <div style="padding:18px 14px;border-radius:14px;border:1px solid var(--cya-line);background:linear-gradient(180deg,var(--cya-soft),transparent);text-align:center">
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px">
      <span class="dot dot--cya" style="width:7px;height:7px"></span>
      <span class="label" style="color:var(--cya);white-space:nowrap">CLOUD</span>
    </div>
    <div style="font-size:11px;color:var(--fg-4)">AI + context</div>
  </div>
</div>
</body></html>
