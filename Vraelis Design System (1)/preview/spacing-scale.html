<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:24px;background:var(--bg-0);">
<div style="display:flex;flex-direction:column;gap:8px;">
  <div style="display:grid;grid-template-columns:60px 80px 1fr;gap:14px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-1)"><div class="label" style="color:var(--fg-4)">token</div><div class="label" style="color:var(--fg-4)">px</div><div class="label" style="color:var(--fg-4)">scale</div></div>
  <div style="display:grid;grid-template-columns:60px 80px 1fr;gap:14px;align-items:center"><span class="mono" style="font-size:11px;color:var(--fg-3)">s-1</span><span class="mono" style="font-size:11px;color:var(--fg-5)">4</span><div style="width:4px;height:14px;background:var(--vio);border-radius:1px"></div></div>
  <div style="display:grid;grid-template-columns:60px 80px 1fr;gap:14px;align-items:center"><span class="mono" style="font-size:11px;color:var(--fg-3)">s-2</span><span class="mono" style="font-size:11px;color:var(--fg-5)">8</span><div style="width:8px;height:14px;background:var(--vio);border-radius:1px"></div></div>
  <div style="display:grid;grid-template-columns:60px 80px 1fr;gap:14px;align-items:center"><span class="mono" style="font-size:11px;color:var(--fg-3)">s-3</span><span class="mono" style="font-size:11px;color:var(--fg-5)">12</span><div style="width:12px;height:14px;background:var(--vio);border-radius:1px"></div></div>
  <div style="display:grid;grid-template-columns:60px 80px 1fr;gap:14px;align-items:center"><span class="mono" style="font-size:11px;color:var(--fg-3)">s-4</span><span class="mono" style="font-size:11px;color:var(--fg-5)">16</span><div style="width:16px;height:14px;background:var(--vio);border-radius:1px"></div></div>
  <div style="display:grid;grid-template-columns:60px 80px 1fr;gap:14px;align-items:center"><span class="mono" style="font-size:11px;color:var(--fg-3)">s-6</span><span class="mono" style="font-size:11px;color:var(--fg-5)">24</span><div style="width:24px;height:14px;background:var(--vio);border-radius:1px"></div></div>
  <div style="display:grid;grid-template-columns:60px 80px 1fr;gap:14px;align-items:center"><span class="mono" style="font-size:11px;color:var(--fg-3)">s-8</span><span class="mono" style="font-size:11px;color:var(--fg-5)">32</span><div style="width:32px;height:14px;background:var(--vio);border-radius:1px"></div></div>
  <div style="display:grid;grid-template-columns:60px 80px 1fr;gap:14px;align-items:center"><span class="mono" style="font-size:11px;color:var(--fg-3)">s-12</span><span class="mono" style="font-size:11px;color:var(--fg-5)">48</span><div style="width:48px;height:14px;background:var(--vio);border-radius:1px"></div></div>
  <div style="display:grid;grid-template-columns:60px 80px 1fr;gap:14px;align-items:center"><span class="mono" style="font-size:11px;color:var(--fg-3)">s-20</span><span class="mono" style="font-size:11px;color:var(--fg-5)">80</span><div style="width:80px;height:14px;background:var(--vio);border-radius:1px"></div></div>
</div>
</body></html>
