<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:24px;background:var(--bg-0);">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
  <div style="border-radius:18px;border:1px solid var(--line-2);background:var(--bg-elev-1);padding:22px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px">
      <div>
        <div style="font-size:14px;font-weight:600;color:var(--fg-2)">Free</div>
        <div style="font-size:11px;color:var(--fg-5);margin-top:2px">Get started</div>
      </div>
    </div>
    <div style="font-size:26px;font-weight:600;letter-spacing:-0.02em;color:var(--fg-1);margin-bottom:3px">$0</div>
    <div style="font-size:11px;color:var(--fg-5);margin-bottom:18px">forever</div>
    <div style="height:1px;background:var(--line-1);margin-bottom:14px"></div>
    <ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px">
      <li style="display:flex;gap:8px;font-size:12px;color:var(--fg-3)"><span style="width:4px;height:4px;border-radius:50%;background:rgba(168,196,255,0.4);margin-top:7px"></span>Pair one Lens</li>
      <li style="display:flex;gap:8px;font-size:12px;color:var(--fg-3)"><span style="width:4px;height:4px;border-radius:50%;background:rgba(168,196,255,0.4);margin-top:7px"></span>5 hours / month recording</li>
    </ul>
  </div>
  <div style="border-radius:18px;border:1px solid var(--sky-line);background:var(--sky-soft);padding:22px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px">
      <div>
        <div style="font-size:14px;font-weight:600;color:var(--sky)">Studio</div>
        <div style="font-size:11px;color:var(--fg-5);margin-top:2px">For daily wear</div>
      </div>
      <span style="font-size:10px;font-family:var(--font-mono);letter-spacing:0.10em;padding:3px 8px;border-radius:100px;border:1px solid var(--sky-line);color:rgba(168,196,255,0.75)">POPULAR</span>
    </div>
    <div style="font-size:26px;font-weight:600;letter-spacing:-0.02em;color:var(--fg-1);margin-bottom:3px">$12</div>
    <div style="font-size:11px;color:var(--fg-5);margin-bottom:18px">per month</div>
    <div style="height:1px;background:var(--line-1);margin-bottom:14px"></div>
    <ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px">
      <li style="display:flex;gap:8px;font-size:12px;color:var(--fg-3)"><span style="width:4px;height:4px;border-radius:50%;background:rgba(168,196,255,0.4);margin-top:7px"></span>Unlimited recording</li>
      <li style="display:flex;gap:8px;font-size:12px;color:var(--fg-3)"><span style="width:4px;height:4px;border-radius:50%;background:rgba(168,196,255,0.4);margin-top:7px"></span>360° playback in cloud</li>
    </ul>
  </div>
</div>
</body></html>
