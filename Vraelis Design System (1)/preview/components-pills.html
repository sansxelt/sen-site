<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:24px;background:var(--bg-0);">
<div style="display:flex;flex-direction:column;gap:14px;">
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <span class="pill"><span class="dot dot--vio"></span>Lens</span>
    <span class="pill"><span class="dot dot--cya"></span>Audio</span>
    <span class="pill"><span class="dot dot--sky"></span>Workshop</span>
    <span class="pill"><span class="dot dot--ok"></span>Paired</span>
    <span class="pill" style="color:var(--rec);border-color:rgba(239,68,68,0.35)"><span class="dot dot--rec"></span>Recording</span>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <span class="pill" style="border-color:var(--sky-line);color:var(--sky);background:var(--sky-soft)">Live</span>
    <span class="pill" style="border-color:var(--warn-line);color:var(--warn);background:var(--warn-soft)">Battery low</span>
    <span class="pill" style="border-color:var(--ok-line);color:var(--ok);background:var(--ok-soft)">Synced</span>
    <span class="pill" style="border-color:var(--err-line);color:var(--err);background:var(--err-soft)">Disconnected</span>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <span style="font-size:10px;font-family:var(--font-mono);letter-spacing:0.10em;padding:3px 8px;border-radius:100px;border:1px solid var(--sky-line);color:rgba(168,196,255,0.75)">RECOMMENDED</span>
    <span style="font-size:10px;font-family:var(--font-mono);letter-spacing:0.10em;padding:3px 8px;border-radius:100px;border:1px solid var(--vio-line);color:var(--vio)">FLAGSHIP</span>
    <span style="font-size:10px;font-family:var(--font-mono);letter-spacing:0.10em;padding:3px 8px;border-radius:100px;border:1px solid var(--line-3);color:var(--fg-4)">BETA</span>
  </div>
</div>
</body></html>
