<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:24px;background:var(--bg-0);">
<div style="border-radius:24px;border:1px solid var(--vio-line);background:linear-gradient(180deg,rgba(192,132,252,0.06),rgba(192,132,252,0.02));padding:32px;text-align:center;backdrop-filter:blur(20px);position:relative;overflow:hidden">
  <div aria-hidden style="position:absolute;inset:0;background:radial-gradient(ellipse 50% 40% at 50% 50%, rgba(192,132,252,0.06) 0%, transparent 60%);pointer-events:none"></div>
  <div style="position:relative">
    <h2 class="cinematic-display cinematic-display--gradient" style="font-size:36px;line-height:1.05;margin:0 0 12px">Be first to wear Vraelis.</h2>
    <p style="font-size:14px;color:rgba(245,245,247,0.72);max-width:380px;margin:0 auto 22px;line-height:1.55">We will email when there is an early-access window or development-kit signup. No spam, no marketing pollution.</p>
    <form style="display:flex;gap:8px;max-width:380px;margin:0 auto">
      <input type="email" placeholder="you@domain.com" style="flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--vio-line);background:rgba(0,0,0,0.4);color:var(--fg-2);font-family:var(--font-sans);font-size:13px;outline:none" />
      <button style="padding:11px 18px;border-radius:10px;border:none;background:var(--vio);color:var(--fg-on-accent);font-family:var(--font-sans);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap">Join</button>
    </form>
  </div>
</div>
</body></html>
