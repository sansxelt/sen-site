<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:24px;background:var(--bg-0);">
<div style="display:flex;flex-direction:column;gap:12px;">
  <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-1)">
    <div style="position:relative;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #6e6e7a, #1c1c22);border:1px solid var(--line-3);flex-shrink:0">
      <span style="position:absolute;bottom:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);border:2px solid var(--bg-1)"></span>
    </div>
    <div style="flex:1">
      <div style="font-size:14px;color:var(--fg-2);font-weight:500">Vraelis · onyx</div>
      <div class="mono" style="font-size:11px;color:var(--fg-5)">paired · battery 78% · firmware 1.4.2</div>
    </div>
    <span class="pill" style="border-color:var(--ok-line);color:var(--ok);background:var(--ok-soft)">Active</span>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-1)">
    <div style="position:relative;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #6e6e7a, #1c1c22);border:1px solid var(--line-3);flex-shrink:0">
      <span style="position:absolute;bottom:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--bg-1)"></span>
    </div>
    <div style="flex:1">
      <div style="font-size:14px;color:var(--fg-2);font-weight:500">Vraelis · sand</div>
      <div class="mono" style="font-size:11px;color:var(--fg-5)">paired · battery 14% · firmware 1.4.2</div>
    </div>
    <span class="pill" style="border-color:var(--warn-line);color:var(--warn);background:var(--warn-soft)">Charge</span>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;border:1px dashed var(--line-3);background:transparent">
    <div style="width:36px;height:36px;border-radius:50%;border:1px dashed var(--line-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--fg-5)">+</div>
    <div style="flex:1">
      <div style="font-size:14px;color:var(--fg-3)">Pair a new device</div>
      <div class="mono" style="font-size:11px;color:var(--fg-5)">hold the case open near your phone</div>
    </div>
  </div>
</div>
</body></html>
