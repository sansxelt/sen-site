<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:24px;background:var(--bg-0);">
<div style="display:flex;flex-direction:column;gap:16px;">
  <div>
    <div class="label" style="margin-bottom:8px;color:var(--fg-4)">mono uppercase label · .16em tracking</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap">
      <span class="label" style="color:var(--vio)">LENS</span>
      <span class="label" style="color:var(--cya)">RECORDING</span>
      <span class="label" style="color:var(--sky)">WORKSHOP</span>
      <span class="label">MODE</span>
      <span class="label" style="color:var(--ok)">PAIRED</span>
    </div>
  </div>
  <div style="border-top:1px solid var(--line-1);padding-top:14px">
    <div class="label" style="margin-bottom:8px;color:var(--fg-4)">mono inline · .06em tracking</div>
    <div class="mono" style="font-size:13px;color:var(--fg-3)">$ vraelis pair --device lens-01</div>
    <div class="mono" style="font-size:13px;color:var(--fg-3);margin-top:4px">→ <span style="color:var(--ok)">connected · battery 78% · firmware 1.4.2</span></div>
  </div>
  <div style="border-top:1px solid var(--line-1);padding-top:14px">
    <div class="label" style="margin-bottom:8px;color:var(--fg-4)">code block</div>
    <pre class="mono" style="margin:0;background:var(--bg-1);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--fg-2);overflow:auto">const lens = await vraelis.connect({ mode: <span style="color:var(--vio)">"ambient"</span> });</pre>
  </div>
</div>
</body></html>
