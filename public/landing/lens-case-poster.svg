<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="caseGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#a8c4ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#a8c4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="600" height="600" fill="url(#caseGlow)"/>

  <!-- Crosshair guides -->
  <g stroke="#3a4358" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.55">
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
  </g>

  <!-- TOP DOWN VIEW (open lid, both wells visible) -->
  <!-- Outer body outline (rounded rectangle) -->
  <rect x="120" y="160" width="360" height="240" rx="36" stroke="#a8c4ff" stroke-width="1.2" opacity="0.85" fill="none"/>
  <!-- Inner soft-touch tray -->
  <rect x="135" y="178" width="330" height="206" rx="24" stroke="#7ab5ff" stroke-width="0.7" opacity="0.4" fill="none"/>
  <!-- Hinge seam line -->
  <line x1="125" y1="170" x2="475" y2="170" stroke="#7ab5ff" stroke-width="0.6" opacity="0.55" stroke-dasharray="6 4"/>

  <!-- Two charging wells (top-down circles) -->
  <g>
    <circle cx="220" cy="280" r="48" stroke="#a8c4ff" stroke-width="1" opacity="0.85" fill="none"/>
    <circle cx="220" cy="280" r="42" stroke="#22d3ee" stroke-width="0.5" opacity="0.5" fill="none"/>
    <text x="220" y="284" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#22d3ee" letter-spacing="2" opacity="0.85">A</text>
    <!-- 2 gold contact pins inside -->
    <circle cx="208" cy="280" r="3" fill="#caa56a" opacity="0.85"/>
    <circle cx="232" cy="280" r="3" fill="#caa56a" opacity="0.85"/>
  </g>
  <g>
    <circle cx="380" cy="280" r="48" stroke="#a8c4ff" stroke-width="1" opacity="0.85" fill="none"/>
    <circle cx="380" cy="280" r="42" stroke="#c084fc" stroke-width="0.5" opacity="0.5" fill="none"/>
    <text x="380" y="284" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc" letter-spacing="2" opacity="0.85">B</text>
    <circle cx="368" cy="280" r="3" fill="#caa56a" opacity="0.85"/>
    <circle cx="392" cy="280" r="3" fill="#caa56a" opacity="0.85"/>
  </g>

  <!-- Vent slot (back face indication) -->
  <g stroke="#7ab5ff" stroke-width="0.5" opacity="0.4">
    <line x1="200" y1="380" x2="400" y2="380"/>
    <line x1="200" y1="383" x2="400" y2="383"/>
    <line x1="200" y1="386" x2="400" y2="386"/>
  </g>

  <!-- Status LED -->
  <circle cx="450" cy="385" r="2.4" fill="#22c55e" opacity="0.95"/>

  <!-- Dimension brackets -->
  <g stroke="#7ab5ff" stroke-width="0.8" opacity="0.5" fill="none">
    <line x1="120" y1="430" x2="480" y2="430"/>
    <line x1="120" y1="425" x2="120" y2="435"/>
    <line x1="480" y1="425" x2="480" y2="435"/>
    <line x1="500" y1="160" x2="500" y2="400"/>
    <line x1="495" y1="160" x2="505" y2="160"/>
    <line x1="495" y1="400" x2="505" y2="400"/>
  </g>
  <g fill="#7ab5ff" opacity="0.7" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">
    <text x="300" y="446" text-anchor="middle">52 mm</text>
    <text x="514" y="284">36 mm</text>
  </g>

  <!-- Corner registration marks -->
  <g stroke="#7ab5ff" stroke-width="0.8" opacity="0.5">
    <path d="M 60 60 L 80 60 M 60 60 L 60 80"/>
    <path d="M 540 60 L 520 60 M 540 60 L 540 80"/>
    <path d="M 60 540 L 80 540 M 60 540 L 60 520"/>
    <path d="M 540 540 L 520 540 M 540 540 L 540 520"/>
  </g>

  <!-- Footer -->
  <g font-family="ui-monospace, monospace" fill="#7ab5ff" opacity="0.65" letter-spacing="2">
    <text x="60" y="572" font-size="9">LENS DAY KIT · case · concept · top view</text>
    <text x="540" y="572" font-size="9" text-anchor="end">SCALE 6:1</text>
  </g>
</svg>
