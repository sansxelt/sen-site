<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="caseBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a2440" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#0a0d1a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#040406" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caseBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#15181f"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <radialGradient id="wellA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wellB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="2.0"/></filter>
  </defs>

  <rect x="0" y="0" width="600" height="600" fill="url(#caseBg)"/>

  <!-- Case body — soft rounded rectangle, no hard outline -->
  <rect x="120" y="200" width="360" height="200" rx="38" fill="url(#caseBody)" filter="url(#softBlur)"/>
  <!-- Subtle top edge highlight (chamfer) -->
  <rect x="124" y="202" width="352" height="3" rx="1.5" fill="#a8c4ff" opacity="0.18"/>
  <!-- Soft body glow -->
  <rect x="120" y="200" width="360" height="200" rx="38" fill="none" stroke="#a8c4ff" stroke-width="0.6" opacity="0.22"/>

  <!-- Hinge seam (very faint) -->
  <line x1="160" y1="226" x2="440" y2="226" stroke="#a8c4ff" stroke-width="0.5" opacity="0.32" stroke-dasharray="3 3"/>

  <!-- Two charging wells with bokeh glow -->
  <g filter="url(#softBlur)">
    <circle cx="220" cy="295" r="48" fill="url(#wellA)"/>
    <circle cx="380" cy="295" r="48" fill="url(#wellB)"/>
  </g>
  <!-- Well rim hints -->
  <circle cx="220" cy="295" r="32" stroke="#22d3ee" stroke-width="0.6" opacity="0.45" fill="none"/>
  <circle cx="380" cy="295" r="32" stroke="#c084fc" stroke-width="0.6" opacity="0.45" fill="none"/>

  <!-- Tiny status LED -->
  <circle cx="450" cy="378" r="2.5" fill="#22c55e" opacity="0.95" filter="url(#softBlur)"/>
</svg>
