<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="wglow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="600" height="600" fill="url(#wglow)"/>

  <!-- Crosshair guides -->
  <g stroke="#3a4358" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.55">
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
  </g>

  <!-- Concentric field rings (equipotential) -->
  <g stroke="#7ab5ff" fill="none">
    <circle cx="300" cy="300" r="240" stroke-width="0.5" opacity="0.18"/>
    <circle cx="300" cy="300" r="200" stroke-width="0.5" opacity="0.24"/>
    <circle cx="300" cy="300" r="160" stroke-width="0.6" opacity="0.32"/>
  </g>

  <!-- Earbud body — orthographic side view, vertical -->
  <g transform="translate(300 300)">
    <!-- Stem -->
    <rect x="-32" y="-30" width="64" height="160" rx="32" stroke="#a8c4ff" stroke-width="1.2" opacity="0.85" fill="none"/>
    <!-- Inner stem chamfer -->
    <rect x="-26" y="-22" width="52" height="146" rx="26" stroke="#7ab5ff" stroke-width="0.5" opacity="0.4" fill="none"/>

    <!-- Soft-touch ear-tip (top widening section) -->
    <path d="M -34 -28 L -38 -50 L 38 -50 L 34 -28 Z" stroke="#a8c4ff" stroke-width="1" opacity="0.7" fill="none"/>

    <!-- Glass driver dome (top circle) -->
    <circle cx="0" cy="-78" r="40" stroke="#a8c4ff" stroke-width="1.2" opacity="0.85" fill="none"/>
    <circle cx="0" cy="-78" r="22" stroke="#7ab5ff" stroke-width="0.6" opacity="0.5" fill="none"/>
    <!-- 12 perforation dots in the grille -->
    <g fill="#a8c4ff" opacity="0.7">
      <circle cx="0" cy="-96" r="1.6"/>
      <circle cx="11" cy="-94" r="1.6"/>
      <circle cx="18" cy="-87" r="1.6"/>
      <circle cx="20" cy="-78" r="1.6"/>
      <circle cx="18" cy="-69" r="1.6"/>
      <circle cx="11" cy="-62" r="1.6"/>
      <circle cx="0" cy="-60" r="1.6"/>
      <circle cx="-11" cy="-62" r="1.6"/>
      <circle cx="-18" cy="-69" r="1.6"/>
      <circle cx="-20" cy="-78" r="1.6"/>
      <circle cx="-18" cy="-87" r="1.6"/>
      <circle cx="-11" cy="-94" r="1.6"/>
    </g>

    <!-- Capacitive touch ring (mid-stem) -->
    <line x1="-32" y1="14" x2="32" y2="14" stroke="#5a6378" stroke-width="0.7" opacity="0.7"/>
    <circle cx="-32" cy="14" r="1.6" fill="#a8c4ff" opacity="0.7"/>
    <circle cx="32" cy="14" r="1.6" fill="#a8c4ff" opacity="0.7"/>

    <!-- Mic vents (3 slits at base) -->
    <g stroke="#02030a" stroke-width="2" opacity="0.6">
      <line x1="-22" y1="120" x2="-12" y2="120"/>
      <line x1="-5"  y1="120" x2="5"  y2="120"/>
      <line x1="12"  y1="120" x2="22" y2="120"/>
    </g>

    <!-- Mic ring at the very base -->
    <circle cx="0" cy="138" r="14" stroke="#22d3ee" stroke-width="1" opacity="0.7" fill="none"/>
    <circle cx="0" cy="138" r="3" fill="#04060e" opacity="0.95"/>
  </g>

  <!-- Dimension brackets -->
  <g stroke="#7ab5ff" stroke-width="0.8" opacity="0.5" fill="none">
    <line x1="385" y1="222" x2="385" y2="438"/>
    <line x1="380" y1="222" x2="390" y2="222"/>
    <line x1="380" y1="438" x2="390" y2="438"/>
  </g>
  <g fill="#7ab5ff" opacity="0.7" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">
    <text x="395" y="334">28 mm</text>
  </g>

  <!-- Corner registration marks -->
  <g stroke="#7ab5ff" stroke-width="0.8" opacity="0.5">
    <path d="M 60 60 L 80 60 M 60 60 L 60 80"/>
    <path d="M 540 60 L 520 60 M 540 60 L 540 80"/>
    <path d="M 60 540 L 80 540 M 60 540 L 60 520"/>
    <path d="M 540 540 L 520 540 M 540 540 L 540 520"/>
  </g>

  <!-- Footer -->
  <g font-family="ui-monospace, monospace" fill="#7ab5ff" opacity="0.65" letter-spacing="2">
    <text x="60" y="572" font-size="9">WHISPER · earbud · concept · side view</text>
    <text x="540" y="572" font-size="9" text-anchor="end">SCALE 8:1</text>
  </g>
</svg>
