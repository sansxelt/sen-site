<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="whisperBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1a2c50" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#0a0d1a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#040406" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1c1f2a"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <radialGradient id="dome" cx="50%" cy="40%" r="50%">
      <stop offset="0%"  stop-color="#dde4f5" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#a8c4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a8c4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="2.0"/></filter>
  </defs>

  <rect x="0" y="0" width="600" height="600" fill="url(#whisperBg)"/>

  <!-- Earbud body, soft silhouette -->
  <g transform="translate(300 300)" filter="url(#softBlur)">
    <!-- Stem -->
    <rect x="-34" y="-30" width="68" height="170" rx="34" fill="url(#stem)"/>
    <!-- Soft tip -->
    <ellipse cx="0" cy="-26" rx="40" ry="14" fill="#1a1c20" opacity="0.95"/>
    <!-- Glass dome -->
    <circle cx="0" cy="-72" r="46" fill="url(#dome)"/>
  </g>

  <!-- Subtle accent highlights, no outlines -->
  <g transform="translate(300 300)">
    <!-- Stainless accent ring at the dome-tip junction -->
    <ellipse cx="0" cy="-22" rx="40" ry="6" stroke="#9aa3b8" stroke-width="0.7" opacity="0.55" fill="none"/>
    <!-- Capacitive band hint -->
    <line x1="-34" y1="14" x2="34" y2="14" stroke="#5a6378" stroke-width="0.6" opacity="0.55"/>
    <!-- Mic ring at base -->
    <circle cx="0" cy="138" r="14" stroke="#22d3ee" stroke-width="0.7" opacity="0.45" fill="none"/>
    <circle cx="0" cy="138" r="3" fill="#04060e" opacity="0.95"/>
  </g>

  <!-- Bokeh glow on the driver — restrained -->
  <g filter="url(#softBlur)" opacity="0.75">
    <circle cx="300" cy="228" r="14" fill="#a8c4ff"/>
  </g>
</svg>
