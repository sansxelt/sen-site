<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="wsBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#0a1226" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#040406" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tabletGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0c1226" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#03050a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1c1f2a"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>

  <rect x="0" y="0" width="600" height="600" fill="url(#wsBg)"/>

  <!-- Central tablet — soft bezel + glass + content rows -->
  <g filter="url(#softBlur)">
    <rect x="190" y="150" width="220" height="170" rx="14" fill="url(#bezel)"/>
    <rect x="200" y="160" width="200" height="150" rx="9" fill="url(#tabletGlass)"/>
  </g>
  <rect x="190" y="150" width="220" height="170" rx="14" fill="none" stroke="#a8c4ff" stroke-width="0.6" opacity="0.30"/>
  <!-- Tablet content rows, very soft -->
  <g opacity="0.55">
    <line x1="216" y1="186" x2="232" y2="186" stroke="#a8c4ff" stroke-width="2"/>
    <line x1="216" y1="208" x2="384" y2="208" stroke="#a8c4ff" stroke-width="1.4"/>
    <line x1="216" y1="226" x2="368" y2="226" stroke="#a8c4ff" stroke-width="1.2" opacity="0.85"/>
    <line x1="216" y1="244" x2="346" y2="244" stroke="#a8c4ff" stroke-width="1" opacity="0.65"/>
    <line x1="216" y1="262" x2="328" y2="262" stroke="#a8c4ff" stroke-width="1" opacity="0.45"/>
  </g>
  <!-- Stand -->
  <line x1="280" y1="320" x2="280" y2="370" stroke="#7ab5ff" stroke-width="1" opacity="0.40"/>
  <line x1="320" y1="320" x2="320" y2="370" stroke="#7ab5ff" stroke-width="1" opacity="0.40"/>
  <rect x="260" y="370" width="80" height="10" rx="2" fill="#1c1f2a" opacity="0.85"/>

  <!-- Two satellite tiles (rotated, soft) -->
  <g filter="url(#softBlur)" transform="translate(70 200) rotate(-6)">
    <rect width="110" height="120" rx="10" fill="url(#bezel)"/>
  </g>
  <g transform="translate(70 200) rotate(-6)">
    <rect width="110" height="120" rx="10" fill="none" stroke="#7ab5ff" stroke-width="0.6" opacity="0.35"/>
    <line x1="10" y1="14" x2="22" y2="14" stroke="#7ab5ff" stroke-width="2" opacity="0.70"/>
  </g>

  <g filter="url(#softBlur)" transform="translate(420 200) rotate(6)">
    <rect width="110" height="120" rx="10" fill="url(#bezel)"/>
  </g>
  <g transform="translate(420 200) rotate(6)">
    <rect width="110" height="120" rx="10" fill="none" stroke="#22d3ee" stroke-width="0.6" opacity="0.35"/>
    <line x1="10" y1="14" x2="22" y2="14" stroke="#22d3ee" stroke-width="2" opacity="0.70"/>
  </g>

  <!-- Faint base — no perforations, just a wash -->
  <ellipse cx="300" cy="430" rx="240" ry="14" fill="#0a0d1a" opacity="0.65" filter="url(#softBlur)"/>
</svg>
