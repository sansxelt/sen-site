<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="wsGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#a8c4ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#a8c4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="600" height="600" fill="url(#wsGlow)"/>

  <!-- Crosshair guides -->
  <g stroke="#3a4358" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.55">
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
  </g>

  <!-- Perforated CNC base plate (top-down) -->
  <rect x="80" y="380" width="440" height="60" rx="6" stroke="#a8c4ff" stroke-width="1" opacity="0.7" fill="none"/>
  <g fill="#7ab5ff" opacity="0.4">
    <!-- 9 x 2 perforation grid -->
    <circle cx="116" cy="400" r="2"/><circle cx="160" cy="400" r="2"/><circle cx="204" cy="400" r="2"/>
    <circle cx="248" cy="400" r="2"/><circle cx="292" cy="400" r="2"/><circle cx="336" cy="400" r="2"/>
    <circle cx="380" cy="400" r="2"/><circle cx="424" cy="400" r="2"/><circle cx="468" cy="400" r="2"/>
    <circle cx="116" cy="420" r="2"/><circle cx="160" cy="420" r="2"/><circle cx="204" cy="420" r="2"/>
    <circle cx="248" cy="420" r="2"/><circle cx="292" cy="420" r="2"/><circle cx="336" cy="420" r="2"/>
    <circle cx="380" cy="420" r="2"/><circle cx="424" cy="420" r="2"/><circle cx="468" cy="420" r="2"/>
  </g>

  <!-- Central tablet (front silhouette) -->
  <rect x="200" y="160" width="200" height="160" rx="10" stroke="#a8c4ff" stroke-width="1.2" opacity="0.85" fill="none"/>
  <rect x="208" y="168" width="184" height="144" rx="6" stroke="#7ab5ff" stroke-width="0.5" opacity="0.4" fill="none"/>
  <!-- Tablet header bar -->
  <line x1="216" y1="178" x2="232" y2="178" stroke="#a8c4ff" stroke-width="2" opacity="0.85"/>
  <text x="240" y="183" font-family="ui-monospace, monospace" font-size="8" fill="#a8c4ff" letter-spacing="2" opacity="0.85">WORKSHOP</text>
  <!-- Content rows -->
  <g stroke="#a8c4ff" opacity="0.55">
    <line x1="216" y1="200" x2="384" y2="200" stroke-width="1.5"/>
    <line x1="216" y1="220" x2="370" y2="220" stroke-width="1.2" opacity="0.7"/>
    <line x1="216" y1="240" x2="356" y2="240" stroke-width="1" opacity="0.55"/>
    <line x1="216" y1="260" x2="342" y2="260" stroke-width="1" opacity="0.4"/>
    <line x1="216" y1="280" x2="328" y2="280" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Tablet stand -->
  <line x1="280" y1="320" x2="280" y2="370" stroke="#7ab5ff" stroke-width="1" opacity="0.5"/>
  <line x1="320" y1="320" x2="320" y2="370" stroke="#7ab5ff" stroke-width="1" opacity="0.5"/>
  <rect x="260" y="370" width="80" height="10" rx="2" stroke="#7ab5ff" stroke-width="0.8" opacity="0.55" fill="none"/>

  <!-- Left satellite (chat) -->
  <g transform="translate(70 200) rotate(-6)">
    <rect width="110" height="120" rx="8" stroke="#7ab5ff" stroke-width="1" opacity="0.7" fill="none"/>
    <line x1="10" y1="14" x2="22" y2="14" stroke="#7ab5ff" stroke-width="2" opacity="0.85"/>
    <text x="28" y="18" font-family="ui-monospace, monospace" font-size="6" fill="#7ab5ff" letter-spacing="1.5" opacity="0.85">CHAT</text>
    <line x1="10" y1="34" x2="96" y2="34" stroke="#7ab5ff" stroke-width="0.7" opacity="0.5"/>
    <line x1="10" y1="50" x2="86" y2="50" stroke="#7ab5ff" stroke-width="0.6" opacity="0.4"/>
    <line x1="10" y1="64" x2="76" y2="64" stroke="#7ab5ff" stroke-width="0.6" opacity="0.35"/>
  </g>

  <!-- Right satellite (files) -->
  <g transform="translate(420 200) rotate(6)">
    <rect width="110" height="120" rx="8" stroke="#22d3ee" stroke-width="1" opacity="0.7" fill="none"/>
    <line x1="10" y1="14" x2="22" y2="14" stroke="#22d3ee" stroke-width="2" opacity="0.85"/>
    <text x="28" y="18" font-family="ui-monospace, monospace" font-size="6" fill="#22d3ee" letter-spacing="1.5" opacity="0.85">FILES</text>
    <line x1="10" y1="34" x2="96" y2="34" stroke="#22d3ee" stroke-width="0.7" opacity="0.5"/>
    <line x1="10" y1="50" x2="86" y2="50" stroke="#22d3ee" stroke-width="0.6" opacity="0.4"/>
    <line x1="10" y1="64" x2="76" y2="64" stroke="#22d3ee" stroke-width="0.6" opacity="0.35"/>
  </g>

  <!-- Memory drives (under base, hinted) -->
  <g opacity="0.6">
    <rect x="180" y="455" width="50" height="14" rx="2" stroke="#7ab5ff" stroke-width="0.8" fill="none"/>
    <rect x="244" y="455" width="50" height="14" rx="2" stroke="#a8c4ff" stroke-width="0.8" fill="none"/>
    <rect x="308" y="455" width="50" height="14" rx="2" stroke="#22d3ee" stroke-width="0.8" fill="none"/>
  </g>

  <!-- Corner registration marks -->
  <g stroke="#7ab5ff" stroke-width="0.8" opacity="0.5">
    <path d="M 60 60 L 80 60 M 60 60 L 60 80"/>
    <path d="M 540 60 L 520 60 M 540 60 L 540 80"/>
    <path d="M 60 540 L 80 540 M 60 540 L 60 520"/>
    <path d="M 540 540 L 520 540 M 540 540 L 540 520"/>
  </g>

  <!-- Footer -->
  <g font-family="ui-monospace, monospace" fill="#7ab5ff" opacity="0.65" letter-spacing="2">
    <text x="60" y="572" font-size="9">WORKSHOP · spatial dashboard · concept</text>
    <text x="540" y="572" font-size="9" text-anchor="end">FRONT VIEW</text>
  </g>
</svg>
