    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a8c4ff" stop-opacity="0"/>
