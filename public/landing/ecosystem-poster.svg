<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="archBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#0a1226" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#040406" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="memBus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15183a"/>
      <stop offset="100%" stop-color="#06070d"/>
    </linearGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>

  <rect x="0" y="0" width="600" height="600" fill="url(#archBg)"/>

  <!-- Memory bus plate, soft -->
  <rect x="80" y="430" width="440" height="60" rx="14" fill="url(#memBus)" filter="url(#softBlur)"/>
  <rect x="80" y="430" width="440" height="60" rx="14" fill="none" stroke="#a8c4ff" stroke-width="0.5" opacity="0.32"/>

  <!-- Three product nodes — bokeh-glow squares -->
  <g filter="url(#softBlur)">
    <rect x="100" y="200" width="80" height="80" rx="14" fill="#0a0a14" opacity="0.95"/>
    <circle cx="140" cy="226" r="6" fill="#22d3ee"/>

    <rect x="260" y="200" width="80" height="80" rx="14" fill="#0a0a14" opacity="0.95"/>
    <circle cx="300" cy="226" r="6" fill="#60a5fa"/>

    <rect x="420" y="200" width="80" height="80" rx="14" fill="#0a0a14" opacity="0.95"/>
    <circle cx="460" cy="226" r="6" fill="#c084fc"/>
  </g>
  <g>
    <rect x="100" y="200" width="80" height="80" rx="14" fill="none" stroke="#22d3ee" stroke-width="0.6" opacity="0.42"/>
    <rect x="260" y="200" width="80" height="80" rx="14" fill="none" stroke="#60a5fa" stroke-width="0.6" opacity="0.42"/>
    <rect x="420" y="200" width="80" height="80" rx="14" fill="none" stroke="#c084fc" stroke-width="0.6" opacity="0.42"/>
  </g>

  <!-- Soft trace lines down to the bus, faded -->
  <g opacity="0.35" filter="url(#softBlur)" stroke-width="1.2">
    <line x1="140" y1="285" x2="220" y2="430" stroke="#22d3ee"/>
    <line x1="300" y1="285" x2="300" y2="430" stroke="#60a5fa"/>
    <line x1="460" y1="285" x2="380" y2="430" stroke="#c084fc"/>
  </g>
</svg>
