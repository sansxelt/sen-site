<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="orbitBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%"  stop-color="#1e3a8a" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#0a1226" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#040406" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#a8c4ff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#5eaaff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect x="0" y="0" width="600" height="600" fill="url(#orbitBg)"/>

  <!-- Memory core haze -->
  <circle cx="300" cy="300" r="160" fill="url(#coreGlow)" filter="url(#softBlur)"/>

  <!-- Core silhouette -->
  <circle cx="300" cy="300" r="78" stroke="#a8c4ff" stroke-width="0.7" opacity="0.55" fill="#0d1020"/>
  <circle cx="300" cy="300" r="56" stroke="#a8c4ff" stroke-width="0.5" opacity="0.30" fill="none"/>

  <!-- Bokeh modules drifting in space — soft glow circles, no orbit lines -->
  <g filter="url(#softBlur)">
    <circle cx="118" cy="278" r="18" fill="#22d3ee" opacity="0.55"/>
    <circle cx="118" cy="278" r="9"  fill="#22d3ee" opacity="0.95"/>

    <circle cx="486" cy="222" r="16" fill="#c084fc" opacity="0.55"/>
    <circle cx="486" cy="222" r="8"  fill="#c084fc" opacity="0.95"/>

    <circle cx="448" cy="436" r="16" fill="#60a5fa" opacity="0.55"/>
    <circle cx="448" cy="436" r="8"  fill="#60a5fa" opacity="0.95"/>

    <circle cx="170" cy="438" r="12" fill="#dbeafe" opacity="0.45"/>
    <circle cx="170" cy="438" r="6"  fill="#dbeafe" opacity="0.85"/>

    <circle cx="528" cy="352" r="12" fill="#caa56a" opacity="0.45"/>
    <circle cx="528" cy="352" r="6"  fill="#caa56a" opacity="0.85"/>
  </g>

  <!-- A few faint background stars/dust -->
  <g fill="#a8c4ff" opacity="0.30">
    <circle cx="80"  cy="80"  r="0.8"/>
    <circle cx="520" cy="92"  r="0.8"/>
    <circle cx="92"  cy="510" r="0.8"/>
    <circle cx="540" cy="490" r="0.8"/>
    <circle cx="240" cy="60"  r="0.6"/>
    <circle cx="378" cy="540" r="0.6"/>
  </g>
</svg>
