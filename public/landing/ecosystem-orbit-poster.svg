<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c4ff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#5eaaff" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#1e3a8a" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c4ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a8c4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8c4ff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#a8c4ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a8c4ff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <circle cx="300" cy="300" r="290" fill="url(#halo)"/>
  <ellipse cx="300" cy="300" rx="220" ry="60" stroke="url(#ring)" stroke-width="1.2" opacity="0.55"/>
  <ellipse cx="300" cy="300" rx="180" ry="180" stroke="#a8c4ff" stroke-width="0.8" opacity="0.18"/>
  <ellipse cx="300" cy="300" rx="240" ry="100" stroke="url(#ring)" stroke-width="0.9" opacity="0.45" transform="rotate(-25 300 300)"/>

  <circle cx="300" cy="300" r="120" fill="url(#core)"/>
  <circle cx="300" cy="300" r="58"  fill="#a8c4ff" opacity="0.85"/>
  <circle cx="300" cy="300" r="34"  fill="#ffffff" opacity="0.95"/>

  <circle cx="80"  cy="290" r="9"  fill="#22d3ee" opacity="0.95"/>
  <circle cx="500" cy="240" r="7"  fill="#c084fc" opacity="0.95"/>
  <circle cx="430" cy="430" r="7"  fill="#60a5fa" opacity="0.95"/>
  <circle cx="170" cy="430" r="5"  fill="#fbbf24" opacity="0.85"/>
  <circle cx="540" cy="360" r="5"  fill="#e0e7ff" opacity="0.85"/>
</svg>
