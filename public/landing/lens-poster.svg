<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="lensBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1a2440" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#0a0d1a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#040406" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lensCore" cx="50%" cy="48%" r="48%">
      <stop offset="0%"  stop-color="#dde6fa" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#a8c4ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#a8c4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lensRim" cx="50%" cy="50%" r="50%">
      <stop offset="86%" stop-color="#a8c4ff" stop-opacity="0"/>
      <stop offset="93%" stop-color="#a8c4ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7ab5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect x="0" y="0" width="600" height="600" fill="url(#lensBg)"/>

  <!-- Soft transparent disc — the lens itself, almost invisible -->
  <circle cx="300" cy="300" r="180" fill="url(#lensCore)" filter="url(#softBlur)"/>
  <circle cx="300" cy="300" r="180" fill="url(#lensRim)"/>

  <!-- Faint carrier ring glow (no hard line) -->
  <circle cx="300" cy="300" r="178" stroke="#a8c4ff" stroke-width="0.6" opacity="0.25" fill="none"/>

  <!-- A few LED highlights, blurred so they read as bokeh -->
  <g filter="url(#softBlur)" opacity="0.85">
    <circle cx="478" cy="298" r="3.2" fill="#a8c4ff"/>
    <circle cx="296" cy="120" r="3.2" fill="#a8c4ff"/>
    <circle cx="120" cy="304" r="3.2" fill="#a8c4ff"/>
    <circle cx="302" cy="478" r="3.2" fill="#a8c4ff"/>
    <circle cx="408" cy="178" r="2.4" fill="#7ab5ff"/>
    <circle cx="186" cy="412" r="2.4" fill="#7ab5ff"/>
  </g>

  <!-- Iris — barely a hint -->
  <circle cx="300" cy="300" r="34" stroke="#a8c4ff" stroke-width="0.7" opacity="0.55" fill="none"/>
</svg>
