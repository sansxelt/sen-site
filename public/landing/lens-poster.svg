<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#a8c4ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#a8c4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Faint base wash (kept very low so it reads CAD, not glow) -->
  <rect x="0" y="0" width="600" height="600" fill="url(#lensGlow)"/>

  <!-- Crosshair guides -->
  <g stroke="#3a4358" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.6">
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
  </g>

  <!-- Dimension brackets (top + right) -->
  <g stroke="#7ab5ff" stroke-width="0.8" opacity="0.5" fill="none">
    <line x1="120" y1="120" x2="480" y2="120"/>
    <line x1="120" y1="115" x2="120" y2="125"/>
    <line x1="480" y1="115" x2="480" y2="125"/>
    <line x1="480" y1="120" x2="480" y2="480"/>
    <line x1="475" y1="120" x2="485" y2="120"/>
    <line x1="475" y1="480" x2="485" y2="480"/>
  </g>
  <g fill="#7ab5ff" opacity="0.7" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">
    <text x="300" y="110" text-anchor="middle">14.0 mm</text>
    <text x="495" y="304" text-anchor="start">14.0</text>
  </g>

  <!-- Outer electronics carrier ring (top-down view) -->
  <circle cx="300" cy="300" r="180" stroke="#a8c4ff" stroke-width="1.2" opacity="0.85" fill="none"/>
  <circle cx="300" cy="300" r="174" stroke="#7ab5ff" stroke-width="0.6" opacity="0.5" fill="none"/>

  <!-- Inner concentric traces -->
  <circle cx="300" cy="300" r="105" stroke="#7ab5ff" stroke-width="0.5" opacity="0.4" fill="none"/>
  <circle cx="300" cy="300" r="135" stroke="#7ab5ff" stroke-width="0.5" opacity="0.32" fill="none"/>
  <circle cx="300" cy="300" r="155" stroke="#7ab5ff" stroke-width="0.5" opacity="0.24" fill="none"/>

  <!-- Iris reticle -->
  <circle cx="300" cy="300" r="36" stroke="#a8c4ff" stroke-width="1" opacity="0.9" fill="none"/>
  <circle cx="300" cy="300" r="2.4" fill="#a8c4ff" opacity="0.7"/>

  <!-- 24 LEDs around the carrier (small dots) -->
  <g fill="#a8c4ff" opacity="0.95">
    <!-- generated positions on r=180 -->
    <circle cx="480" cy="300" r="2.2"/>
    <circle cx="473.6" cy="346.6" r="2.2"/>
    <circle cx="455.9" cy="389.9" r="2.2"/>
    <circle cx="427.3" cy="427.3" r="2.2"/>
    <circle cx="389.9" cy="455.9" r="2.2"/>
    <circle cx="346.6" cy="473.6" r="2.2"/>
    <circle cx="300" cy="480" r="2.2"/>
    <circle cx="253.4" cy="473.6" r="2.2"/>
    <circle cx="210.1" cy="455.9" r="2.2"/>
    <circle cx="172.7" cy="427.3" r="2.2"/>
    <circle cx="144.1" cy="389.9" r="2.2"/>
    <circle cx="126.4" cy="346.6" r="2.2"/>
    <circle cx="120" cy="300" r="2.2"/>
    <circle cx="126.4" cy="253.4" r="2.2"/>
    <circle cx="144.1" cy="210.1" r="2.2"/>
    <circle cx="172.7" cy="172.7" r="2.2"/>
    <circle cx="210.1" cy="144.1" r="2.2"/>
    <circle cx="253.4" cy="126.4" r="2.2"/>
    <circle cx="300" cy="120" r="2.2"/>
    <circle cx="346.6" cy="126.4" r="2.2"/>
    <circle cx="389.9" cy="144.1" r="2.2"/>
    <circle cx="427.3" cy="172.7" r="2.2"/>
    <circle cx="455.9" cy="210.1" r="2.2"/>
    <circle cx="473.6" cy="253.4" r="2.2"/>
  </g>

  <!-- 6 gold contact pads (rotated rectangles) -->
  <g fill="#caa56a" opacity="0.85">
    <rect x="476" y="296" width="10" height="8" rx="1"/>
    <rect x="383.4" y="450" width="10" height="8" rx="1" transform="rotate(60 388.4 454)"/>
    <rect x="206.6" y="450" width="10" height="8" rx="1" transform="rotate(120 211.6 454)"/>
    <rect x="114" y="296" width="10" height="8" rx="1" transform="rotate(180 119 300)"/>
    <rect x="206.6" y="142" width="10" height="8" rx="1" transform="rotate(240 211.6 146)"/>
    <rect x="383.4" y="142" width="10" height="8" rx="1" transform="rotate(300 388.4 146)"/>
  </g>

  <!-- Corner registration marks (CAD ticks) -->
  <g stroke="#7ab5ff" stroke-width="0.8" opacity="0.5">
    <path d="M 60 60 L 80 60 M 60 60 L 60 80"/>
    <path d="M 540 60 L 520 60 M 540 60 L 540 80"/>
    <path d="M 60 540 L 80 540 M 60 540 L 60 520"/>
    <path d="M 540 540 L 520 540 M 540 540 L 540 520"/>
  </g>

  <!-- Footer label (datasheet style) -->
  <g font-family="ui-monospace, monospace" fill="#7ab5ff" opacity="0.65" letter-spacing="2">
    <text x="60" y="572" font-size="9">LENS · v0.1 · concept · top view</text>
    <text x="540" y="572" font-size="9" text-anchor="end">SCALE 18:1</text>
  </g>
</svg>
