<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:20px;background:var(--bg-0);">
<div style="display:flex;flex-direction:column;gap:10px;">
  <div style="display:flex;align-items:center;gap:14px;padding:14px;border-radius:10px;border:1px solid var(--ok-line);background:var(--ok-soft);">
    <span class="dot dot--ok"></span>
    <div style="color:var(--ok);font-size:14px;font-weight:500;width:90px">ok</div>
    <div style="color:var(--fg-3);font-size:13px;flex:1">Paired. Synced. Saved. Charging complete.</div>
    <div class="mono" style="font-size:11px;color:var(--fg-5)">#34d399</div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:14px;border-radius:10px;border:1px solid var(--warn-line);background:var(--warn-soft);">
    <span class="dot" style="background:var(--warn);box-shadow:0 0 8px var(--warn)"></span>
    <div style="color:var(--warn);font-size:14px;font-weight:500;width:90px">warn</div>
    <div style="color:var(--fg-3);font-size:13px;flex:1">Battery low. Storage 92%. Billing reminder.</div>
    <div class="mono" style="font-size:11px;color:var(--fg-5)">#fbbf24</div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:14px;border-radius:10px;border:1px solid var(--err-line);background:var(--err-soft);">
    <span class="dot" style="background:var(--err);box-shadow:0 0 8px var(--err)"></span>
    <div style="color:var(--err);font-size:14px;font-weight:500;width:90px">err</div>
    <div style="color:var(--fg-3);font-size:13px;flex:1">Disconnected. Upload failed. Retry.</div>
    <div class="mono" style="font-size:11px;color:var(--fg-5)">#fca5a5</div>
  </div>
</div>
</body></html>
