<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:30px;background:var(--bg-0);">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;">
  <div style="text-align:center">
    <div style="width:80px;height:80px;border:1px solid var(--line-2);background:var(--bg-1);border-radius:14px;margin:0 auto 12px;"></div>
    <div class="mono" style="font-size:10px;color:var(--fg-3)">shadow-none</div>
    <div class="mono" style="font-size:9px;color:var(--fg-5);margin-top:2px">default</div>
  </div>
  <div style="text-align:center">
    <div style="width:80px;height:80px;border:1px solid var(--line-2);background:var(--bg-1);border-radius:14px;margin:0 auto 12px;box-shadow:var(--shadow-card)"></div>
    <div class="mono" style="font-size:10px;color:var(--fg-3)">shadow-card</div>
    <div class="mono" style="font-size:9px;color:var(--fg-5);margin-top:2px">on photos</div>
  </div>
  <div style="text-align:center">
    <div style="width:80px;height:80px;border:1px solid var(--vio-line);background:var(--bg-1);border-radius:50%;margin:0 auto 12px;box-shadow:var(--halo-vio);display:flex;align-items:center;justify-content:center"><span class="dot dot--vio" style="width:14px;height:14px;box-shadow:0 0 14px var(--vio)"></span></div>
    <div class="mono" style="font-size:10px;color:var(--vio)">halo-vio</div>
    <div class="mono" style="font-size:9px;color:var(--fg-5);margin-top:2px">on dot/chip</div>
  </div>
  <div style="text-align:center">
    <div style="width:80px;height:80px;border:1px solid rgba(239,68,68,0.28);background:var(--bg-1);border-radius:50%;margin:0 auto 12px;box-shadow:var(--halo-rec);display:flex;align-items:center;justify-content:center"><span class="dot dot--rec" style="width:14px;height:14px"></span></div>
    <div class="mono" style="font-size:10px;color:var(--rec)">halo-rec</div>
    <div class="mono" style="font-size:9px;color:var(--fg-5);margin-top:2px">recording</div>
  </div>
</div>
</body></html>
