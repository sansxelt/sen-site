<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:20px;background:var(--bg-0);">
<div style="display:flex;flex-direction:column;gap:8px;">
  <div style="display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--bg-1);border-radius:10px">
    <div style="width:140px;height:1px;background:var(--line-1);flex-shrink:0"></div>
    <div class="mono" style="font-size:11px;color:var(--fg-4);width:60px">line-1</div>
    <div class="mono" style="font-size:11px;color:var(--fg-5);flex:1">rgba(255,255,255,0.05)</div>
    <div style="font-size:12px;color:var(--fg-4)">default hairline</div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--bg-1);border-radius:10px">
    <div style="width:140px;height:1px;background:var(--line-2);flex-shrink:0"></div>
    <div class="mono" style="font-size:11px;color:var(--fg-4);width:60px">line-2</div>
    <div class="mono" style="font-size:11px;color:var(--fg-5);flex:1">rgba(255,255,255,0.07)</div>
    <div style="font-size:12px;color:var(--fg-4)">card border</div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--bg-1);border-radius:10px">
    <div style="width:140px;height:1px;background:var(--line-3);flex-shrink:0"></div>
    <div class="mono" style="font-size:11px;color:var(--fg-4);width:60px">line-3</div>
    <div class="mono" style="font-size:11px;color:var(--fg-5);flex:1">rgba(255,255,255,0.10)</div>
    <div style="font-size:12px;color:var(--fg-4)">button, hover</div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--bg-1);border-radius:10px">
    <div style="width:140px;height:1px;background:var(--line-4);flex-shrink:0"></div>
    <div class="mono" style="font-size:11px;color:var(--fg-4);width:60px">line-4</div>
    <div class="mono" style="font-size:11px;color:var(--fg-5);flex:1">rgba(255,255,255,0.16)</div>
    <div style="font-size:12px;color:var(--fg-4)">prominent</div>
  </div>
</div>
</body></html>
