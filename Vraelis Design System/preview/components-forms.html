<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:24px;background:var(--bg-0);">
<div style="display:flex;flex-direction:column;gap:14px;max-width:380px">
  <div>
    <label class="label" style="display:block;color:var(--fg-4);margin-bottom:8px">EMAIL</label>
    <input type="email" placeholder="you@domain.com" style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line-3);background:var(--bg-elev-2);color:var(--fg-2);font-family:var(--font-sans);font-size:14px;outline:none;box-sizing:border-box" />
  </div>
  <div>
    <label class="label" style="display:block;color:var(--fg-4);margin-bottom:8px">USE CASE</label>
    <select style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line-3);background:var(--bg-elev-2);color:var(--fg-2);font-family:var(--font-sans);font-size:14px;outline:none;box-sizing:border-box">
      <option>Daily wear</option>
      <option>Field recording</option>
      <option>Accessibility</option>
    </select>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--vio-line);background:var(--vio-soft);">
    <span style="width:16px;height:16px;border-radius:4px;border:1.5px solid var(--vio);background:var(--vio);display:flex;align-items:center;justify-content:center;color:var(--fg-on-accent);font-size:10px;font-weight:700">✓</span>
    <span style="color:var(--fg-2);font-size:13px">I want early access to dev-kit hardware</span>
  </div>
</div>
</body></html>
