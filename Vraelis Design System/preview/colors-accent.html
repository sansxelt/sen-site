<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:20px;background:var(--bg-0);">
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;">
  <div style="border:1px solid var(--vio-line);background:linear-gradient(180deg,var(--vio-soft),transparent 80%);border-radius:14px;padding:18px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="dot dot--vio" style="box-shadow:var(--halo-vio)"></span><span class="label" style="color:var(--vio)">primary · brand</span></div>
    <div style="font-size:22px;font-weight:600;color:var(--fg-1);letter-spacing:-0.02em;margin-bottom:6px">Violet</div>
    <div class="mono" style="font-size:11px;color:var(--fg-4)">#c084fc · --vio</div>
  </div>
  <div style="border:1px solid var(--cya-line);background:linear-gradient(180deg,var(--cya-soft),transparent 80%);border-radius:14px;padding:18px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="dot dot--cya" style="box-shadow:var(--halo-cya)"></span><span class="label" style="color:var(--cya)">audio · signal</span></div>
    <div style="font-size:22px;font-weight:600;color:var(--fg-1);letter-spacing:-0.02em;margin-bottom:6px">Cyan</div>
    <div class="mono" style="font-size:11px;color:var(--fg-4)">#22d3ee · --cya</div>
  </div>
  <div style="border:1px solid var(--sky-line);background:linear-gradient(180deg,var(--sky-soft),transparent 80%);border-radius:14px;padding:18px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="dot dot--sky" style="box-shadow:var(--halo-sky)"></span><span class="label" style="color:var(--sky)">chrome · cta</span></div>
    <div style="font-size:22px;font-weight:600;color:var(--fg-1);letter-spacing:-0.02em;margin-bottom:6px">Pale&nbsp;sky</div>
    <div class="mono" style="font-size:11px;color:var(--fg-4)">#a8c4ff · --sky</div>
  </div>
  <div style="border:1px solid rgba(239,68,68,0.28);background:linear-gradient(180deg,rgba(239,68,68,0.06),transparent 80%);border-radius:14px;padding:18px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="dot dot--rec"></span><span class="label" style="color:var(--rec)">recording only</span></div>
    <div style="font-size:22px;font-weight:600;color:var(--fg-1);letter-spacing:-0.02em;margin-bottom:6px">Record</div>
    <div class="mono" style="font-size:11px;color:var(--fg-4)">#ef4444 · --rec</div>
  </div>
</div>
</body></html>
