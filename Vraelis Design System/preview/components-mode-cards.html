<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:20px;background:var(--bg-0);">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
  <div style="border-radius:18px;border:1px solid var(--vio-line);background:linear-gradient(180deg,var(--vio-soft),transparent 80%);padding:22px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <span class="dot dot--vio" style="box-shadow:var(--halo-vio)"></span>
      <span class="label" style="color:var(--vio);opacity:.85">mode</span>
    </div>
    <h3 style="margin:0 0 8px;font-size:24px;font-weight:600;letter-spacing:-0.02em">Active</h3>
    <p style="margin:0;color:var(--fg-3);font-size:13px;line-height:1.55">Full HUD overlay. Notifications, navigation, live transcripts. Always-on context that stays out of your way.</p>
  </div>
  <div style="border-radius:18px;border:1px solid var(--sky-line);background:linear-gradient(180deg,var(--sky-soft),transparent 80%);padding:22px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <span class="dot dot--sky" style="box-shadow:var(--halo-sky)"></span>
      <span class="label" style="color:var(--sky);opacity:.85">mode</span>
    </div>
    <h3 style="margin:0 0 8px;font-size:24px;font-weight:600;letter-spacing:-0.02em">Recall</h3>
    <p style="margin:0;color:var(--fg-3);font-size:13px;line-height:1.55">Eyes-up, hands-free. Scrub through what you saw and heard earlier today, in 360°, by whispering a query.</p>
  </div>
</div>
</body></html>
