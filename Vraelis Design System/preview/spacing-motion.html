<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:24px;background:var(--bg-0);">
<div style="display:flex;flex-direction:column;gap:14px;">
  <div style="display:grid;grid-template-columns:140px 1fr 120px;gap:14px;align-items:center;padding:10px 14px;background:var(--bg-1);border-radius:10px;border:1px solid var(--line-2)">
    <span class="mono" style="font-size:11px;color:var(--vio)">ease-cinematic</span>
    <svg viewBox="0 0 200 30" style="width:100%;height:24px"><path d="M0 28 C 32 28, 60 4, 200 2" fill="none" stroke="#c084fc" stroke-width="2"/></svg>
    <span class="mono" style="font-size:10px;color:var(--fg-5);text-align:right">0.16,1,0.3,1</span>
  </div>
  <div style="display:grid;grid-template-columns:140px 1fr 120px;gap:14px;align-items:center;padding:10px 14px;background:var(--bg-1);border-radius:10px;border:1px solid var(--line-2)">
    <span class="mono" style="font-size:11px;color:var(--fg-3)">ease-standard</span>
    <svg viewBox="0 0 200 30" style="width:100%;height:24px"><path d="M0 28 C 80 28, 160 2, 200 2" fill="none" stroke="#a1a1aa" stroke-width="2"/></svg>
    <span class="mono" style="font-size:10px;color:var(--fg-5);text-align:right">0.4,0,0.2,1</span>
  </div>
  <div style="border-top:1px solid var(--line-1);padding-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
    <div style="padding:10px;background:var(--bg-1);border-radius:8px;border:1px solid var(--line-2);text-align:center"><div class="mono" style="font-size:10px;color:var(--fg-4)">dur-fast</div><div class="mono" style="font-size:13px;color:var(--fg-2);margin-top:2px">150ms</div></div>
    <div style="padding:10px;background:var(--bg-1);border-radius:8px;border:1px solid var(--line-2);text-align:center"><div class="mono" style="font-size:10px;color:var(--fg-4)">dur-base</div><div class="mono" style="font-size:13px;color:var(--fg-2);margin-top:2px">250ms</div></div>
    <div style="padding:10px;background:var(--bg-1);border-radius:8px;border:1px solid var(--line-2);text-align:center"><div class="mono" style="font-size:10px;color:var(--fg-4)">dur-slow</div><div class="mono" style="font-size:13px;color:var(--fg-2);margin-top:2px">600ms</div></div>
    <div style="padding:10px;background:var(--bg-1);border-radius:8px;border:1px solid var(--vio-line);text-align:center"><div class="mono" style="font-size:10px;color:var(--vio)">dur-act</div><div class="mono" style="font-size:13px;color:var(--fg-1);margin-top:2px">900ms</div></div>
  </div>
</div>
</body></html>
